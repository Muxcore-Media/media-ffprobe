services:
  core:
    image: ghcr.io/muxcore-media/core:latest
    ports:
      - "9090:9090"
    environment:
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  media-ffprobe:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9480"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_GRPC_INSECURE: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: media-ffprobe
    volumes:
      - /path/to/media:/media:ro
      - ffprobe-data:/var/lib/media-ffprobe
    depends_on:
      core:
        condition: service_healthy

volumes:
  ffprobe-data:
